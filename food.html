<!-- 介绍部分 -->

        ↓↓↓↓

  <!-- 美食列表 -->
  <div class="food-section">
    <div class="food-item left">
      <img src="./img/684A6AA2489559DB95E5D93C8E4FBE2D.jpg" alt="过桥米线">
      <div class="food-info">
        <h2>过桥米线</h2>
        <p>红河最具代表性的美食之一，热汤鲜香、米线滑嫩，汤底由鸡汤与猪骨熬制，搭配丰富配料，是一场味蕾的盛宴。</p>
      </div>
    </div>

    <div class="food-item right">
      <img src="./img/036A8FABBBFCC0C1121FB45540405159.jpg" alt="彝族烧烤">
      <div class="food-info">
        <h2>彝族风味烧烤</h2>
        <p>炭火慢烤，撒上特制辣椒面与香料，彝族烧烤融合民族风味与街头文化，是红河夜生活的灵魂。</p>
      </div>
    </div>

    <div class="food-item left">
      <img src="./img/9B58F4522F8FE70485CF7B8CF8DCF29F.jpg" alt="哈尼蘸水鸡">
      <div class="food-info">
        <h2>哈尼蘸水鸡</h2>
        <p>哈尼族独特烹饪方式，保留最鲜美的味道。</p>
      </div>
    </div>

    <div class="food-item right">
      <img src="./img/814DE4261AE33564885D61C3C13C2E24.jpg" alt="野生菌火锅">
      <div class="food-info">
        <h2>野生菌火锅</h2>
        <p>采自高原森林的多种野生菌汇聚一锅，汤底鲜美无比，是红河不可多得的高端养生美食。</p>
      </div>
    </div>
  </div>
