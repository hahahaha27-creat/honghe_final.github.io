<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 旅游宣传网</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/index.css">
    <style>
        .login-container {
            display: flex;
            height: 80%;
            justify-content: center;
            align-items: center;
            margin-top: 80px;
        }
        .login-card {
            width: 400px;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .login-card h3 {
            margin-bottom: 20px;
            color:  #518215;
        }
        .login-card input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }
        .login-card input:focus {
            border-color: #518215;
            outline: none;
            box-shadow: 0 0 5px rgba(32, 173, 98, 0.5);
        }
        .login-card span {
            font-size: 14px;
            display: block;
            margin-top: 5px;
            height: 20px;
        }
        .login-card button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color:  #518215;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-card button:hover {
            background-color: rgb(25, 140, 80);
        }
        .nave-menu {
            width: 100%;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color:  #518215;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .nave-menu .search ul {
            list-style: none;
            display: flex;
            gap: 20px;
            padding: 0;
            margin: 0;
        }
        .nave-menu .search ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="nave-menu">
        <div class="background">
            <a href="https://www.hh.cn/ynhhzMini/site/" target="_blank">
                <img src="./img/logo.png" alt="网站Logo">
            </a>
        </div>
        <div class="search">
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">历史文化</a></li>
                <li><a href="#">自然风光</a></li>
                <li><a href="#">美食</a></li>
                <li><a href="#">旅游推荐</a></li>
            </ul>
        </div>
    </div>

    <!-- 登录表单 -->
    <div class="login-container">
        <div class="login-card">
            <h3>新用户注册</h3>
            <form name="frm_reg" action="./index1.html" method="post" onsubmit="return check_passport();">
                <label>账号：</label>
                <input type="text" name="u_id" id="u_id" placeholder="请输入Email或手机号" onblur="checkU_id()">
                <span id="u_id_txt">*</span>

                <label>密码：</label>
                <input type="password" id="u_pwd">
                <span id="u_pwd_txt">*</span>

                <label>确认密码：</label>
                <input type="password" id="u_pwd_cfm">

                <button type="submit">注册</button>
            </form>
        </div>
    </div>

    <script>
        function checkU_id() {
            let u_id = document.frm_reg.u_id.value;
            const regEmail = /^[a-zA-Z0-9_-]+@[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+)+$/;
            const regMobile = /^1[3456789]\d{9}$/;

            let str = "<font color='green'>✓</font>";
            if (u_id.length <= 0) {
                str = "<font color='red'>账号必须填写</font>";
            } else if (!regEmail.test(u_id) && !regMobile.test(u_id)) {
                str = "<font color='red'>账号必须是Email或手机号</font>";
            }
            document.getElementById("u_id_txt").innerHTML = str;
        }

        function check_passport() {
            const pwd1 = document.getElementById("u_pwd").value;
            const pwd2 = document.getElementById("u_pwd_cfm").value;

            if (pwd1 === pwd2 && pwd1.length > 0) {
                return true;
            } else {
                document.getElementById("u_pwd_txt").innerHTML = "<font color='red'>两次输入的密码不一致</font>";
                return false;
            }
        }
    </script>
</body>
</html>
